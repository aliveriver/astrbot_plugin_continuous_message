name: astrbot_plugin_continuous_message
display_name: 消息防抖动
version: 2.8.0
author: aliveriver
short_desc: 合并短时间内连续发送的私聊消息，减少频繁触发 LLM 回复。
desc: 消息防抖动插件可将用户短时间内发送的多条私聊消息合并成一条发送给大语言模型，支持图片、引用消息、QQ 合并转发、输入状态感知、撤回过滤、ID 黑/白名单、QQ 卡片链接提取和链接解析增强。
description: 消息防抖动插件可将用户短时间内发送的多条私聊消息合并成一条发送给大语言模型，避免频繁触发 AI 回复，提升用户体验。
astrbot_version: ">=4.26.0"
repo: https://github.com/aliveriver/astrbot_plugin_continuous_message
